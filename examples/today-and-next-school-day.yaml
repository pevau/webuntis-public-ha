# Today + next school day
# Replace the entity IDs below with the entity IDs from your Home Assistant instance.

type: vertical-stack
cards:

  - type: markdown
    content: >-
      {% set e = 'sensor.school_class_daily_summary' %}
      {% set status = 'sensor.school_class_school_status' %}
      {% set beginn = state_attr(e, 'school_start_time') %}
      {% set ende = state_attr(e, 'school_end_time') %}
      {% set ausfaelle = state_attr(e, 'cancellations') | int(0) %}
      {% set aenderungen = state_attr(e, 'changes') | int(0) %}
      {% set spaeter = state_attr(e, 'late_start_minutes') | int(0) %}
      {% set frueher = state_attr(e, 'early_end_minutes') | int(0) %}

      ## 📚 Heute

      {% if state_attr(e, 'school_free') %}

      🏠 **Heute ist schulfrei.**

      {% else %}

      🕒 **{{ as_datetime(beginn).strftime('%H:%M') }} –
      {{ as_datetime(ende).strftime('%H:%M') }} Uhr**
      · {{ states(e) }} Stunden

      {% if spaeter > 0 %}
      🟢 Unterricht beginnt **{{ spaeter }} Minuten später**
      {% endif %}

      {% if frueher > 0 %}
      🏠 Schulschluss **{{ frueher }} Minuten früher**
      {% endif %}

      {% if ausfaelle > 0 %}
      🔴 **{{ ausfaelle }} {{ 'Ausfall' if ausfaelle == 1 else 'Ausfälle' }}:**
      {{ (state_attr(e, 'cancelled_subjects') or []) | join(', ') }}
      {% endif %}

      {% if aenderungen > 0 %}
      🟠 **{{ aenderungen }} {{ 'Änderung' if aenderungen == 1 else 'Änderungen' }}:**
      {{ (state_attr(e, 'changed_subjects') or []) | join(', ') }}
      {% endif %}

      {% if states(status) == 'before_school' %}

      ### ⏰ Noch vor Schulbeginn

      Unterricht beginnt um **{{ as_datetime(beginn).strftime('%H:%M') }} Uhr**

      {% elif states(status) == 'lesson' %}

      ### 🎓 Aktuell

      **{{ state_attr(e, 'current_lesson') }}**

      {% if state_attr(e, 'next_lesson') %}
      ⏭️ Danach **{{ state_attr(e, 'next_lesson') }}**
      um {{ as_datetime(state_attr(e, 'next_lesson_start_time')).strftime('%H:%M') }} Uhr
      {% endif %}

      {% elif states(status) == 'break' %}

      ### ☕ Pause

      {% if state_attr(e, 'next_lesson') %}
      ⏭️ Weiter mit **{{ state_attr(e, 'next_lesson') }}**
      um {{ as_datetime(state_attr(e, 'next_lesson_start_time')).strftime('%H:%M') }} Uhr
      {% endif %}

      {% elif states(status) == 'after_school' %}

      ### 🏠 Schule beendet

      {% endif %}

      ### 🗓 Stundenplan

      {% for stunde in state_attr(e, 'schedule') or [] %}

      {% set current =
        now() >= as_datetime(stunde['start_time'])
        and now() < as_datetime(stunde['end_time'])
      %}

      {% if current %}▶️ {% endif %}**{{ as_datetime(stunde['start_time']).strftime('%H:%M') }}
      – {{ as_datetime(stunde['end_time']).strftime('%H:%M') }}**
      · **{{ stunde.get('fach', '—') }}**
      {% if stunde.get('room') %} · 🏫 {{ stunde.get('room') }}{% endif %}
      {% if stunde.get('teachers') %} · 👤 {{ stunde.get('teachers') }}{% endif %}
      {% if stunde.get('changed', false) %} · ⚠️ geändert{% endif %}

      {% endfor %}

      {% endif %}

  - type: markdown
    content: >-
      {% set e = 'sensor.school_class_next_school_day_summary' %}
      {% set datum = state_attr(e, 'date') %}
      {% set tage = state_attr(e, 'days_until') | int(0) %}
      {% set ausfaelle = state_attr(e, 'cancellations') | int(0) %}
      {% set aenderungen = state_attr(e, 'changes') | int(0) %}

      ## 📅 Nächster Schultag

      {% if datum %}

      {% set d = strptime(datum, '%Y-%m-%d') %}
      {% set weekdays = [
        'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag',
        'Freitag', 'Samstag', 'Sonntag'
      ] %}

      ### {{ weekdays[d.weekday()] }}, {{ d.strftime('%d.%m.%Y') }}

      {% if tage == 1 %}
      **Morgen**
      {% elif tage == 2 %}
      **Übermorgen**
      {% else %}
      **In {{ tage }} Tagen**
      {% endif %}

      · 🕒 {{ as_datetime(state_attr(e, 'school_start_time')).strftime('%H:%M') }}
      – {{ as_datetime(state_attr(e, 'school_end_time')).strftime('%H:%M') }} Uhr
      · **{{ states(e) }} Stunden**

      {% if state_attr(e, 'no_school_tomorrow') %}
      🏠 Morgen ist **schulfrei**.
      {% endif %}

      {% if ausfaelle > 0 %}
      🔴 **{{ ausfaelle }} {{ 'Ausfall' if ausfaelle == 1 else 'Ausfälle' }}:**
      {{ (state_attr(e, 'cancelled_subjects') or []) | join(', ') }}
      {% endif %}

      {% if aenderungen > 0 %}
      🟠 **{{ aenderungen }} {{ 'Änderung' if aenderungen == 1 else 'Änderungen' }}:**
      {{ (state_attr(e, 'changed_subjects') or []) | join(', ') }}
      {% endif %}

      ### 🗓 Stundenplan

      {% for stunde in state_attr(e, 'schedule') or [] %}

      **{{ as_datetime(stunde['start_time']).strftime('%H:%M') }}
      – {{ as_datetime(stunde['end_time']).strftime('%H:%M') }}**
      · **{{ stunde.get('fach', '—') }}**
      {% if stunde.get('room') %} · 🏫 {{ stunde.get('room') }}{% endif %}
      {% if stunde.get('teachers') %} · 👤 {{ stunde.get('teachers') }}{% endif %}
      {% if stunde.get('changed', false) %} · ⚠️ geändert{% endif %}

      {% endfor %}

      {% else %}

      Kein weiterer Schultag im geladenen Zeitraum.

      {% endif %}
