blueprint:
  name: WebUntis – School Day Live Activity
  description: >
    Show the current school day as a Home Assistant Companion Live Activity
    (iOS 17.2+) or Live Update (Android 16+). The activity starts when school
    begins, updates when the school status changes, uses the device-side
    chronometer for lesson/break countdowns, and is cleared after school.
  domain: automation
  input:
    school_status:
      name: School status
      description: Select the WebUntis school status sensor for the class.
      selector:
        entity:
          filter:
            - integration: webuntis_public
              domain: sensor
    current_lesson:
      name: Current lesson
      description: Select the matching WebUntis current lesson sensor.
      selector:
        entity:
          filter:
            - integration: webuntis_public
              domain: sensor
    notify_services:
      name: Mobile notification actions
      description: |
        Enter the Home Assistant Companion notification action for each phone
        that should receive the Live Activity.

        Important: This field expects a YAML list, so every action must start
        with a dash (-), even when you only use one phone.

        One phone:
          - notify.mobile_app_iphone

        Multiple phones:
          - notify.mobile_app_iphone
          - notify.mobile_app_iphone_2

        Use the same notify.mobile_app_* action that you would use when sending
        a notification manually from Home Assistant.
      selector:
        object:
    activity_title:
      name: Title
      default: School
      selector:
        text:
    notification_icon:
      name: Notification icon
      description: Select the icon shown for the school Live Activity.
      default: mdi:school
      selector:
        select:
          options:
            - label: School
              value: mdi:school
            - label: School outline
              value: mdi:school-outline
            - label: Book open
              value: mdi:book-open-variant
            - label: Calendar
              value: mdi:calendar
            - label: Backpack
              value: mdi:bag-personal
            - label: Bell
              value: mdi:bell
    notification_icon_color:
      name: Notification icon color
      description: Optional icon color. Leave empty to use the Companion App default.
      default: ""
      selector:
        text:
    dashboard_url:
      name: Open on tap
      description: Optional Home Assistant path, for example /lovelace/school.
      default: ""
      selector:
        text:

mode: restart

triggers:
  - trigger: state
    entity_id: !input school_status
  - trigger: state
    entity_id: !input current_lesson
  - trigger: event
    event_type: webuntis_public_test_live_activity
    id: test

variables:
  school_status_entity: !input school_status
  current_lesson_entity: !input current_lesson
  activity_title: !input activity_title
  dashboard_url: !input dashboard_url
  notification_icon: !input notification_icon
  notification_icon_color: !input notification_icon_color
  notify_services: !input notify_services
  status: "{{ states(school_status_entity) }}"
  current_subject: "{{ state_attr(school_status_entity, 'current_subject') }}"
  current_end: "{{ state_attr(school_status_entity, 'current_lesson_end_time') }}"
  next_subject: "{{ state_attr(school_status_entity, 'next_subject') }}"
  next_start: "{{ state_attr(school_status_entity, 'next_lesson_start_time') }}"
  school_end: "{{ state_attr(school_status_entity, 'school_end_time') }}"
  room: "{{ state_attr(current_lesson_entity, 'room') or '' }}"
  tag: >
    webuntis_school_day_{{ school_status_entity | replace('.', '_') }}
  selected_device_identifier: >
    {{ device_attr(school_status_entity, 'identifiers')
       | selectattr(0, 'eq', 'webuntis_public')
       | map(attribute=1)
       | first
       | default('') }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id | default('') == 'test'
                 and trigger.event.data.device_identifier | default('') == selected_device_identifier }}
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ activity_title }} · Test"
                    message: "School starts soon · First: Mathematics"
                    data:
                      tag: webuntis_test
                      live_update: true
          - delay: "00:00:05"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ activity_title }} · Test"
                    message: "Mathematics · Room 204"
                    data:
                      tag: webuntis_test
                      live_update: true
                      chronometer: true
                      when: 10
                      when_relative: true
          - delay: "00:00:10"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ activity_title }} · Test"
                    message: "Break · Next: English"
                    data:
                      tag: webuntis_test
                      live_update: true
                      chronometer: true
                      when: 5
                      when_relative: true
          - delay: "00:00:05"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "{{ activity_title }} · Test"
                    message: "English · Room 105"
                    data:
                      tag: webuntis_test
                      live_update: true
                      chronometer: true
                      when: 10
                      when_relative: true
          - delay: "00:00:10"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: webuntis_test
      - conditions:
          - condition: template
            value_template: "{{ status in ['after_school', 'school_free', 'unknown', 'unavailable'] }}"
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"
    default:
      - variables:
          countdown_to: >
            {% if status == 'lesson' and current_end %}
              {{ current_end }}
            {% elif status == 'break' and next_start %}
              {{ next_start }}
            {% elif status == 'before_school' and next_start %}
              {{ next_start }}
            {% else %}
              {{ school_end }}
            {% endif %}
          seconds_remaining: >
            {% if countdown_to %}
              {{ [0, (as_timestamp(countdown_to) - as_timestamp(now())) | int] | max }}
            {% else %}0{% endif %}
          message_text: >
            {% if status == 'lesson' %}
              {{ current_subject or 'Lesson' }}{% if room %} · {{ room }}{% endif %}
            {% elif status == 'break' %}
              Break{% if next_subject %} · Next: {{ next_subject }}{% endif %}
            {% elif status == 'before_school' %}
              {% if next_subject %}First: {{ next_subject }}{% else %}School starts soon{% endif %}
            {% else %}
              School day
            {% endif %}
      - repeat:
          for_each: "{{ notify_services }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                title: "{{ activity_title }}"
                message: "{{ message_text | trim }}"
                data:
                  tag: "{{ tag }}"
                  live_update: true
                  silent: true
                  chronometer: "{{ seconds_remaining | int > 0 }}"
                  when: "{{ seconds_remaining | int }}"
                  when_relative: true
                  notification_icon: "{{ notification_icon }}"
                  notification_icon_color: "{{ notification_icon_color }}"
                  progress_bar_direction: increasing
                  url: "{{ dashboard_url }}"
