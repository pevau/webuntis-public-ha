blueprint:
  name: WebUntis – School Day Live Activity
  description: >
    Show the current school day as a Home Assistant Companion Live Activity
    (iOS 17.2+) or Live Update (Android 16+). The activity starts when school
    begins, updates when the school status changes, shows the current subject
    and end time, and is cleared after school.
  domain: automation
  input:
    school_status:
      name: School status
      description: Select the WebUntis school status sensor for the class.
      selector:
        entity:
          filter:
            - integration: webuntis_public
              domain: sensor
    current_lesson:
      name: Current lesson
      description: Select the matching WebUntis current lesson sensor.
      selector:
        entity:
          filter:
            - integration: webuntis_public
              domain: sensor
    notify_services:
      name: Mobile notification actions
      description: |
        Enter the Home Assistant Companion notification action for each phone
        that should receive the Live Activity.

        Important: This field expects a YAML list, so every action must start
        with a dash (-), even when you only use one phone.

        One phone:
          - notify.mobile_app_iphone

        Multiple phones:
          - notify.mobile_app_iphone
          - notify.mobile_app_iphone_2

        Use the same notify.mobile_app_* action that you would use when sending
        a notification manually from Home Assistant.
      selector:
        object:
    activity_title:
      name: Title
      default: School
      selector:
        text:
    notification_icon:
      name: Notification icon
      description: Select the icon shown for the school Live Activity.
      default: mdi:school
      selector:
        icon:
    notification_icon_color:
      name: Notification icon color
      description: Optional icon color. Leave empty to use white.
      default: ""
      selector:
        text:
    dashboard_url:
      name: Open on tap
      description: Optional Home Assistant path, for example /lovelace/school.
      default: ""
      selector:
        text:

mode: restart

triggers:
  - trigger: state
    entity_id: !input school_status
  - trigger: state
    entity_id: !input current_lesson
  - trigger: event
    event_type: webuntis_public_test_live_activity
    id: test

variables:
  school_status_entity: !input school_status
  current_lesson_entity: !input current_lesson
  activity_title: !input activity_title
  dashboard_url: !input dashboard_url
  notification_icon: !input notification_icon
  notification_icon_color: !input notification_icon_color
  notify_services: !input notify_services
  status: "{{ states(school_status_entity) }}"
  current_subject: "{{ state_attr(school_status_entity, 'current_subject') }}"
  next_subject: "{{ state_attr(school_status_entity, 'next_subject') }}"
  current_end: "{{ state_attr(school_status_entity, 'current_lesson_end_time') }}"
  next_start: "{{ state_attr(school_status_entity, 'next_lesson_start_time') }}"
  room: "{{ state_attr(current_lesson_entity, 'room') or '' }}"
  selected_device_identifier: >
    {{ device_attr(school_status_entity, 'identifiers')
       | selectattr(0, 'eq', 'webuntis_public')
       | map(attribute=1)
       | first
       | default('') }}
  tag: >-
    webuntis_{{ selected_device_identifier | replace('.', '_') | replace('-', '_') }}

actions:
  - variables:
      is_test: >
        {{ trigger.id | default('') == 'test'
           and trigger.event.data.device_identifier | default('') == selected_device_identifier }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_test }}"
        sequence:
          - variables:
              test_steps:
                - status: before_school
                  subject: Mathematics
                  room: ""
                  next_subject: Mathematics
                  seconds: 5
                - status: lesson
                  subject: Mathematics
                  room: Room 204
                  next_subject: English
                  seconds: 10
                - status: break
                  subject: ""
                  room: ""
                  next_subject: English
                  seconds: 5
                - status: lesson
                  subject: English
                  room: Room 105
                  next_subject: ""
                  seconds: 10
          - repeat:
              for_each: "{{ test_steps }}"
              sequence:
                - variables:
                    effective_status: "{{ repeat.item.status }}"
                    effective_subject: "{{ repeat.item.subject }}"
                    effective_room: "{{ repeat.item.room }}"
                    effective_next_subject: "{{ repeat.item.next_subject }}"
                    effective_seconds: "{{ repeat.item.seconds }}"
                    effective_until: "{{ (now() + timedelta(seconds=effective_seconds | int)).isoformat() }}"
                    effective_tag: webuntis_test
                    effective_title: "{{ activity_title }} · Test"
                    effective_message: >
                      {% if effective_status == 'lesson' %}
                        {{ effective_subject or 'Lesson' }}{% if effective_room %} · {{ effective_room }}{% endif %}{% if effective_until %} – bis {{ as_timestamp(effective_until) | timestamp_custom('%H:%M', true) }} Uhr{% endif %}
                      {% elif effective_status == 'break' %}
                        Break{% if effective_next_subject %} · Next: {{ effective_next_subject }}{% endif %}{% if effective_until %} · {{ as_timestamp(effective_until) | timestamp_custom('%H:%M', true) }}{% endif %}
                      {% elif effective_status == 'before_school' %}
                        {% if effective_next_subject %}First: {{ effective_next_subject }}{% else %}School starts soon{% endif %}{% if effective_until %} · {{ as_timestamp(effective_until) | timestamp_custom('%H:%M', true) }}{% endif %}
                      {% else %}
                        School day
                      {% endif %}
                - repeat:
                    for_each: "{{ notify_services }}"
                    sequence:
                      - action: "{{ repeat.item }}"
                        data:
                          title: "{{ effective_title }}"
                          message: "{{ effective_message | trim }}"
                          data:
                            tag: "{{ effective_tag }}"
                            live_update: true
                            silent: true
                            notification_icon: "{{ notification_icon }}"
                            notification_icon_color: "{{ notification_icon_color or '#FFFFFF' }}"
                            url: "{{ dashboard_url }}"
                - delay:
                    seconds: "{{ effective_seconds | int }}"
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: webuntis_test
      - conditions:
          - condition: template
            value_template: "{{ status in ['after_school', 'school_free', 'unknown', 'unavailable'] }}"
        sequence:
          - repeat:
              for_each: "{{ notify_services }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"
    default:
      - variables:
          effective_status: "{{ status }}"
          effective_subject: "{{ current_subject or '' }}"
          effective_room: "{{ room }}"
          effective_next_subject: "{{ next_subject or '' }}"
          effective_until: "{{ current_end if status == 'lesson' else next_start if status in ['before_school', 'break'] else '' }}"
          effective_tag: "{{ tag }}"
          effective_title: "{{ activity_title }}"
          effective_message: >
            {% if effective_status == 'lesson' %}
              {{ effective_subject or 'Lesson' }}{% if effective_room %} · {{ effective_room }}{% endif %}{% if effective_until %} – bis {{ as_timestamp(effective_until) | timestamp_custom('%H:%M', true) }} Uhr{% endif %}
            {% elif effective_status == 'break' %}
              Break{% if effective_next_subject %} · Next: {{ effective_next_subject }}{% endif %}{% if effective_until %} · {{ as_timestamp(effective_until) | timestamp_custom('%H:%M', true) }}{% endif %}
            {% elif effective_status == 'before_school' %}
              {% if effective_next_subject %}First: {{ effective_next_subject }}{% else %}School starts soon{% endif %}{% if effective_until %} · {{ as_timestamp(effective_until) | timestamp_custom('%H:%M', true) }}{% endif %}
            {% else %}
              School day
            {% endif %}
      - repeat:
          for_each: "{{ notify_services }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
                title: "{{ effective_title }}"
                message: "{{ effective_message | trim }}"
                data:
                  tag: "{{ effective_tag }}"
                  live_update: true
                  silent: true
                  notification_icon: "{{ notification_icon }}"
                  notification_icon_color: "{{ notification_icon_color or '#FFFFFF' }}"
                  url: "{{ dashboard_url }}"
