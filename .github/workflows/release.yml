name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "custom_components/webuntis_public/manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("custom_components/webuntis_public/manifest.json")
              .read_text(encoding="utf-8")
          )
          print(manifest["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

      - name: Build release notes from changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\].*?\n(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"No CHANGELOG entry found for version {version}")

          body = match.group("body").strip()
          Path(".release-notes.md").write_text(
              f"## What's changed\n\n{body}\n",
              encoding="utf-8",
          )
          print(Path(".release-notes.md").read_text(encoding="utf-8"))
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          # Let GitHub create the tag together with the release. This avoids a
          # short window where HACS can see a new tag before release notes exist.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "WebUntis Public $VERSION" \
            --notes-file .release-notes.md
