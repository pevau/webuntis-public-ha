name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate JSON and translations
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("hacs.json"),
              Path("custom_components/webuntis_public/manifest.json"),
              Path("custom_components/webuntis_public/translations/en.json"),
              Path("custom_components/webuntis_public/translations/de.json"),
          ]
          for file in files:
              json.loads(file.read_text(encoding="utf-8"))
              print(f"OK: {file}")

          def shape(value):
              if isinstance(value, dict):
                  return {key: shape(item) for key, item in value.items()}
              return None

          en = json.loads(
              Path("custom_components/webuntis_public/translations/en.json")
              .read_text(encoding="utf-8")
          )
          de = json.loads(
              Path("custom_components/webuntis_public/translations/de.json")
              .read_text(encoding="utf-8")
          )
          if shape(en) != shape(de):
              raise SystemExit("Translation structures differ between en.json and de.json")
          print("OK: en/de translation key structure matches")

          manifest = json.loads(
              Path("custom_components/webuntis_public/manifest.json")
              .read_text(encoding="utf-8")
          )
          version = manifest["version"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{version}]" not in changelog:
              raise SystemExit(f"Missing CHANGELOG entry for version {version}")
          print(f"OK: CHANGELOG contains version {version}")
          PY

      - name: Compile Python files
        shell: bash
        run: |
          python -m compileall -q custom_components/webuntis_public

      - name: Check HACS structure
        shell: bash
        run: |
          test -f hacs.json
          test -f CHANGELOG.md
          test -f custom_components/webuntis_public/manifest.json
          test -f custom_components/webuntis_public/__init__.py
          test -f custom_components/webuntis_public/config_flow.py
          test -f custom_components/webuntis_public/brand/icon.png
          test -f custom_components/webuntis_public/brand/dark_icon.png
          test -f custom_components/webuntis_public/translations/en.json
          test -f custom_components/webuntis_public/translations/de.json
          test ! -f custom_components/webuntis_public/strings.json
