name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache test environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-3.14-venv-${{ hashFiles('requirements_test.txt') }}

      - name: Create test environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements_test.txt

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q custom_components tests

      - name: Run tests with coverage
        run: >
          .venv/bin/python -m pytest -q
          --cov=custom_components.webuntis_public
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=95

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COVERAGE=$(.venv/bin/python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 2))")
          COLOR=$(.venv/bin/python -c "c=float('$COVERAGE'); print('brightgreen' if c >= 95 else 'green' if c >= 90 else 'yellow' if c >= 80 else 'orange' if c >= 70 else 'red')")
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$COVERAGE" "$COLOR" > .github/badges/coverage.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update coverage badge [skip ci]"
          git push
