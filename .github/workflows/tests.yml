name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio homeassistant
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = json.loads(
              pathlib.Path("custom_components/webuntis_public/manifest.json").read_text()
          )
          requirements = manifest.get("requirements", [])
          if requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY

      - name: Compile Python sources
        run: python -m compileall -q custom_components tests

      - name: Run tests
        run: python -m pytest -q
